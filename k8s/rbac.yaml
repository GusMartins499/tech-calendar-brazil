# Permissões mínimas para o sidecar do Tailscale persistir o estado do nó
# (chaves, identidade) em um Secret do Kubernetes — o "kube state store".
# Sem isso, o container geraria um novo nó no tailnet a cada restart.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tech-calendar
  namespace: tech-calendar
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tailscale-state
  namespace: tech-calendar
rules:
  # Cria o Secret de estado na primeira subida.
  - apiGroups: ['']
    resources: ['secrets']
    verbs: ['create']
  # Lê/atualiza apenas o próprio Secret de estado.
  - apiGroups: ['']
    resources: ['secrets']
    resourceNames: ['tailscale-state']
    verbs: ['get', 'update', 'patch']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tailscale-state
  namespace: tech-calendar
subjects:
  - kind: ServiceAccount
    name: tech-calendar
    namespace: tech-calendar
roleRef:
  kind: Role
  name: tailscale-state
  apiGroup: rbac.authorization.k8s.io
