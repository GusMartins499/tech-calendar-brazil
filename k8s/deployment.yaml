apiVersion: apps/v1
kind: Deployment
metadata:
  name: tech-calendar
  namespace: tech-calendar
  labels:
    app: tech-calendar
spec:
  # 1 réplica: SQLite é single-writer e o PVC é RWO.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tech-calendar
  template:
    metadata:
      labels:
        app: tech-calendar
    spec:
      serviceAccountName: tech-calendar
      # fsGroup faz o kubelet ajustar o grupo do PVC para 1000, permitindo que
      # o usuário 'node' (uid/gid 1000) da imagem grave o banco em /data.
      securityContext:
        fsGroup: 1000
      containers:
        # --- Aplicação Next.js ---
        - name: app
          # A tag é fixada pelo `images` transformer do kustomization.yaml
          # (sha-<commit> imutável, atualizado pelo CD). Nunca use :latest aqui.
          image: ghcr.io/gusmartins499/my-calendar-tech-brazil
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: tech-calendar-app
          # DB_FILE_NAME e MIGRATIONS_FOLDER já vêm da imagem; reforçado aqui.
          env:
            - name: DB_FILE_NAME
              value: file:/data/local.db
          volumeMounts:
            - name: db
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
        # --- Sidecar Tailscale (userspace, sem privilégios) ---
        - name: tailscale
          # Versão fixada (evita :latest). Atualize conforme sua stable.
          image: tailscale/tailscale:v1.98.9
          imagePullPolicy: IfNotPresent
          env:
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: tailscale-auth
                  key: TS_AUTHKEY
            # Persiste o estado do nó neste Secret (kube state store).
            - name: TS_KUBE_SECRET
              value: tailscale-state
            # Rede em userspace: dispensa NET_ADMIN e /dev/net/tun.
            - name: TS_USERSPACE
              value: 'true'
            # Nome do nó no tailnet → tech-calendar.<seu-tailnet>.ts.net
            - name: TS_HOSTNAME
              value: tech-calendar
            # Publica HTTPS e faz proxy para o app (ver ConfigMap).
            - name: TS_SERVE_CONFIG
              value: /etc/tailscale/serve.json
          volumeMounts:
            - name: tailscale-serve
              mountPath: /etc/tailscale
              readOnly: true
      volumes:
        - name: db
          persistentVolumeClaim:
            claimName: tech-calendar-db
        - name: tailscale-serve
          configMap:
            name: tailscale-serve
