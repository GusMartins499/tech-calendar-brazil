# EXEMPLO — copie para `secret.yaml`, preencha os valores e NÃO comite o real.
# (secret.yaml está no .gitignore.)
#
# Crie os secrets assim (mais seguro que comitar YAML com valores):
#
#   kubectl -n tech-calendar create secret generic tech-calendar-app \
#     --from-literal=GOOGLE_CLIENT_ID='...' \
#     --from-literal=GOOGLE_CLIENT_SECRET='...' \
#     --from-literal=BETTER_AUTH_SECRET="$(openssl rand -base64 32)" \
#     --from-literal=BETTER_AUTH_URL='https://tech-calendar.<SEU-TAILNET>.ts.net'
#
#   kubectl -n tech-calendar create secret generic tailscale-auth \
#     --from-literal=TS_AUTHKEY='tskey-auth-...'
#
# TS_AUTHKEY: gere em https://login.tailscale.com/admin/settings/keys
#   (marque "Reusable" e, se quiser, "Ephemeral" = não; use tags se tiver ACL).
---
apiVersion: v1
kind: Secret
metadata:
  name: tech-calendar-app
  namespace: tech-calendar
type: Opaque
stringData:
  GOOGLE_CLIENT_ID: 'PREENCHER'
  GOOGLE_CLIENT_SECRET: 'PREENCHER'
  # gere com: openssl rand -base64 32
  BETTER_AUTH_SECRET: 'PREENCHER'
  # FQDN do nó no seu tailnet (o mesmo que vai no redirect URI do Google)
  BETTER_AUTH_URL: 'https://tech-calendar.<SEU-TAILNET>.ts.net'
---
apiVersion: v1
kind: Secret
metadata:
  name: tailscale-auth
  namespace: tech-calendar
type: Opaque
stringData:
  TS_AUTHKEY: 'tskey-auth-PREENCHER'
