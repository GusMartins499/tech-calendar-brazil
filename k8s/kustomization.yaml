apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tech-calendar

resources:
  - namespace.yaml
  - rbac.yaml
  - pvc.yaml
  - configmap-tailscale-serve.yaml
  - deployment.yaml
  - service.yaml
  # Os Secrets NÃO entram aqui: crie-os via `kubectl create secret`
  # (veja secret.example.yaml) ou adicione um secret.yaml local (git-ignored).

# Fixa a tag imutável da imagem num único lugar. O CD atualiza `newTag` com o
# sha-<commit> a cada release (nunca usar :latest em produção).
images:
  - name: ghcr.io/gusmartins499/my-calendar-tech-brazil
    newTag: sha-0000000
