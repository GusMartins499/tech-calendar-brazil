name: Publish Docker image

on:
  push:
    branches: [main]
    tags: ['v*.*.*']

# Evita builds concorrentes sobre o mesmo ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write # para o CD atualizar o kustomization na main
      packages: write # para publicar no GHCR
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Faz checkout da branch (não do SHA em detached) para permitir o
          # commit de volta do kustomization nos pushes da main.
          ref: ${{ github.ref_name }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # sempre: tag imutável a partir do commit
            type=sha,prefix=sha-,format=short
            # em git tags vX.Y.Z: semver e latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # CD: fixa o deployment na imagem imutável recém-publicada (apenas na main).
      - name: Pin image in kustomization (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          sed -i -E "s|(newTag:).*|\1 sha-${SHORT_SHA}|" k8s/kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/kustomization.yaml
          if git diff --staged --quiet; then
            echo "kustomization já atualizado, nada a commitar"
          else
            git commit -m "chore(cd): fixa imagem em sha-${SHORT_SHA} [skip ci]"
            git push
          fi
