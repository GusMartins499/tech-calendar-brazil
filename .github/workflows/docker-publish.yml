name: CI/CD

on:
  push:
    branches: [main]

# Evita builds concorrentes sobre o mesmo ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Mantém um "Release PR" acumulando os Conventional Commits e calculando a
  # próxima versão + CHANGELOG. Ao mergear esse PR, cria a tag vX.Y.Z + Release.
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write # cria tags/releases e commita o CHANGELOG/bump
      pull-requests: write # cria/atualiza o Release PR
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      version: ${{ steps.rp.outputs.version }}
      major: ${{ steps.rp.outputs.major }}
      minor: ${{ steps.rp.outputs.minor }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Sempre publica sha-<commit> (imutável, usado pelo CD). Quando o run é o
  # merge do Release PR (release_created=true), adiciona também as tags semver
  # e latest — sem precisar de PAT nem de um segundo workflow.
  build-and-push:
    needs: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: write # para o CD atualizar o kustomization na main
      packages: write # para publicar no GHCR
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Faz checkout da branch (não do SHA em detached) para permitir o
          # commit de volta do kustomization.
          ref: ${{ github.ref_name }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # sempre: tag imutável a partir do commit
            type=sha,prefix=sha-,format=short
            # só quando o release-please cortou uma versão: semver + latest
            type=raw,value=${{ needs.release-please.outputs.version }},enable=${{ needs.release-please.outputs.release_created }}
            type=raw,value=${{ needs.release-please.outputs.major }}.${{ needs.release-please.outputs.minor }},enable=${{ needs.release-please.outputs.release_created }}
            type=raw,value=latest,enable=${{ needs.release-please.outputs.release_created }}

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # CD: fixa o deployment na imagem imutável recém-publicada.
      - name: Pin image in kustomization
        run: |
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          sed -i -E "s|(newTag:).*|\1 sha-${SHORT_SHA}|" k8s/kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/kustomization.yaml
          if git diff --staged --quiet; then
            echo "kustomization já atualizado, nada a commitar"
          else
            git commit -m "chore(cd): fixa imagem em sha-${SHORT_SHA} [skip ci]"
            git push
          fi
